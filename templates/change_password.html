{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block container_class %}narrow-container{% endblock %}

{% block content %}
<h2>Смена пароля</h2>
{% if error %}<div class="error-message">{{ error }}</div>{% endif %}
{% if message %}<div class="success-message">{{ message }}</div>{% endif %}

<form method="post" action="/account/password" class="registration-form" style="max-width:420px">
    <div class="form-group">
        <label for="current_password">Текущий пароль:</label>
        <input type="password" id="current_password" name="current_password" class="form-input"
               autocomplete="current-password" required>
    </div>
    <div class="form-group">
        <label for="new_password">Новый пароль (не короче 8 символов):</label>
        <input type="password" id="new_password" name="new_password" class="form-input"
               autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-group">
        <label for="confirm_password">Повторите новый пароль:</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input"
               autocomplete="new-password" minlength="8" required>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сменить пароль</button>
        <a href="/select" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
